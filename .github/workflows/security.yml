name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The pull_request trigger catches an advisory a PR introduces. The
      # schedule is what catches an advisory published against dependencies
      # that never changed, which is how 19 of them accumulated here unseen.
      #
      # This also guards the scoped `node-gyp/undici` and the three
      # `brace-expansion@<range>` resolutions in package.json. Yarn's
      # parent/child and ranged resolutions only bind when the descriptor
      # still matches, and when they stop matching they are ignored
      # silently: install still exits 0. Without this job, a dropped pin
      # looks exactly like a passing build.
      #
      # There are no ignores. The previous `--ignore 1124334`
      # (GHSA-mh99-v99m-4gvg, the brace-expansion unbounded-expansion OOM)
      # was retired 2026-08-11 because its premise expired: it was added
      # when that advisory had no patched release on any major, and 1.1.17
      # and 2.1.3 have since shipped. The brace-expansion resolutions now
      # clear it by version instead of by exception.
      #
      # That ignore was deliberately pinned to an advisory ID rather than a
      # package glob, and the comment here predicted that a NEW
      # brace-expansion advisory would carry a new ID and still fail this
      # job. That is exactly what happened: GHSA-rgw5-rvv9-x895 landed,
      # explicitly bypassing the CVE-2026-14257 mitigation, with a range of
      # >=4.0.0 <5.0.9 -- and the 5.x tree was pinned to 5.0.8, one patch
      # short. An ID-scoped ignore is why that surfaced instead of being
      # swallowed. Keep future ignores ID-scoped for the same reason.
      - name: Audit for high/critical vulnerabilities
        run: yarn npm audit --all --recursive --severity high
